<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub User Finder</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; width: 70%; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #profile { margin-top: 20px; text-align: left; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; display: block; margin: 0 auto 10px; }
        .error { color: red; }
    </style>
</head>
<body>

    <div class="card">
        <h2>GitHub Finder</h2>
        <input type="text" id="username" placeholder="Enter GitHub username...">
        <button id="search-btn">Search</button>
        
        <div id="profile"></div>
    </div>

    <script src="GithubService.js"></script>
    <script src="script.js"></script>
</body>
</html>
